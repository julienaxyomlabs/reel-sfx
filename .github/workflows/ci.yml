name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - name: CLI smoke test (installed package)
        run: |
          reel-sfx --version
          reel-sfx list
          reel-sfx place examples/cues.json --duration 6 --out sfx_stem.wav
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: wheel carries every sound and nothing else unexpected
        run: |
          python - <<'PY'
          import json, zipfile, glob
          whl = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(whl).namelist()
          wavs = [n for n in names if n.endswith('.wav')]
          meta = json.load(open('src/reel_sfx/sounds/sounds.json'))
          assert len(wavs) == len(meta['sounds']), (len(wavs), len(meta['sounds']))
          bad = [n for n in names if not n.startswith(('reel_sfx/', 'reel_sfx-'))]
          assert not bad, bad
          print(whl, len(names), 'files,', len(wavs), 'wavs')
          PY
